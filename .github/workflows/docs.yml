name: Docs
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
    branches-ignore:
      - 'MOP4-dev'
  pull_request:
    paths:
      - 'docs/**'
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - id: deployment
      uses: sphinx-notes/pages@v3
      with:
        publish: false
    - uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        destination_dir: ${{ github.ref_name }}
        publish_dir: ${{ steps.deployment.outputs.artifact }}
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages
    - uses: actions/copy-files@v4
      with:
        source-directory: ./assets/docs/index.html
        destination-directory: ./gh-pages
    - name: Commit and Push Redirect index
      run: |
        git config --local user.name "${{ secrets.GITHUB_ACTOR }}"
        git config --local user.email "${{ secrets.GITHUB_ACTOR }}@users.noreply.github.com"
        git add .
        git commit -m "Update gh-pages"
        git push origin gh-pages
